name: Google Flights Scraper Job

on:
  schedule:
    - cron: '0 6 * * *' # Every day at 6:00 AM UTC (3:00 AM BRT)
  workflow_dispatch:      # Allows manual triggers from GitHub UI
  repository_dispatch:    # Allows API triggers from Vercel backend
    types: 
      - scrape-all
      - scrape-route
      - scrape-batch

concurrency:
  group: scraper-batch-${{ github.event.client_payload.origin || 'all' }}-${{ github.event.client_payload.destination || 'all' }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: |
          npm ci --prefix server || npm install --prefix server

      - name: Install Puppeteer Chromium Browser Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev wget gnupg
          npx --prefix server puppeteer browsers install chrome

      - name: Execute Scraper Engine
        run: |
          echo "Executing single runner batch scrape (processing all pending search legs in MongoDB)"
          node server/src/cron-scraper.js
        env:
          MONGO_URI: ${{ secrets.MONGO_URI || secrets.MONGODB_URI }}
          NODE_ENV: production
